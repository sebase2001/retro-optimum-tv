name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android TV Leanback Banner & Launcher
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<category android:name="android.intent.category.LAUNCHER" \/>/<category android:name="android.intent.category.LAUNCHER" \/>\n <category android:name="android.intent.category.LEANBACK_LAUNCHER" \/>/' $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Optimum-TV-Retro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
