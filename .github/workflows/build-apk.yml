name: Build and Release Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npx vite build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Add Android Platform
        run: npx cap add android
        continue-on-error: true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Android TV Leanback Banner & Launcher
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<category android:name="android.intent.category.LAUNCHER" \/>/<category android:name="android.intent.category.LAUNCHER" \/>\n <category android:name="android.intent.category.LEANBACK_LAUNCHER" \/>/' $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate Version Tag
        id: tag
        run: echo "tag_name=v1.0.$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Optimum Retro TV Build (${{ steps.tag.outputs.tag_name }})"
          body: "Automated Android TV build featuring 30 retro channels, dual-buffer Debrid commercial streaming, and TMDB random episode picker."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
